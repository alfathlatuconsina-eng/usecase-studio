<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Branch Operations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #e11d48; }
  body { font-family: 'Segoe UI', Arial, sans-serif; }

  #login-page {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: #f4f6f9;
  }
  .login-box {
    background: #ffffff; border: 1px solid #d8dee6;
    border-radius: 14px; padding: 44px 40px 36px;
    width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,.12);
  }
  .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .login-logo-bar { width: 4px; height: 36px; background: var(--accent); border-radius: 2px; flex-shrink: 0; }
  .login-logo-text .brand { font-size: 18px; font-weight: 700; color: #1e2329; line-height: 1.1; }
  .login-logo-text .sub { font-size: 10px; letter-spacing: 2px; color: #8a94a1; text-transform: uppercase; margin-top: 2px; }
  .login-heading { font-size: 26px; font-weight: 700; color: #1e2329; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: #5a6673; margin-bottom: 28px; }
  .login-box label { display: block; font-size: 10px; font-weight: 700; color: #5a6673;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; margin-top: 18px; }
  .login-box input { width: 100%; padding: 11px 14px; background: #f4f6f9; border: 1px solid #d8dee6;
    border-radius: 7px; font-size: 14px; color: #1e2329; outline: none; transition: border-color .15s; }
  .login-box input::placeholder { color: #9aa3ad; }
  .login-box input:focus { border-color: var(--accent); }
  #login-error { color: #e05252; font-size: 12px; margin-top: 10px; min-height: 16px; }
  /* Pemberitahuan keluar otomatis. Sengaja BUKAN warna galat merah:
     ini bukan kesalahan siapa pun, dan tampilan galat membuat orang
     mengira aplikasinya rusak lalu melapor. */
  #idle-note { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 7px;
    background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
    font-size: 12px; line-height: 1.5; }
  .btn-primary { width: 100%; padding: 13px; margin-top: 24px; background: var(--accent);
    color: #fff; border: none; border-radius: 7px; font-size: 15px; font-weight: 700;
    letter-spacing: .2px; cursor: pointer; transition: background .15s, transform .1s; }
  .btn-primary:hover  { background: #f43f5e; }
  .btn-primary:active { transform: scale(.98); }
  .login-footer { text-align: center; margin-top: 22px; font-size: 11px; color: #8a94a1; line-height: 1.5; }
  .login-home-link { display: block; text-align: center; margin-top: 18px; font-size: 12px;
    color: #5a6673; letter-spacing: .3px; text-decoration: none; transition: color .15s; }
  .login-home-link:hover { color: var(--accent); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px; }
  .pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px; color: #8a8a8a;
    padding: 4px 6px; line-height: 1; }
  .pw-toggle:hover { color: var(--accent); }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-bar"></div>
      <div class="login-logo-text">
        <div class="brand">Branch Operations Monitoring</div>
        <div class="sub">Branch Operations</div>
      </div>
    </div>
    <div class="login-heading">Sign In</div>
    <div class="login-sub">Enter your credentials to access this module.</div>
    <div id="idle-note">Anda dikeluarkan otomatis karena layar dibiarkan menganggur.
      Silakan masuk lagi untuk melanjutkan.</div>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" placeholder="you@bank.co.id" autocomplete="username">
    <label for="login-pw">Password</label>
    <div class="pw-wrap">
      <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">👁</button>
    </div>
    <div id="login-error"></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <a href="https://usecase-studio.xyz/" class="login-home-link">← Back to Home</a>
    <div class="login-footer"><a href="/about" style="color:inherit;text-decoration:underline">© 2026 Alfath Latuconsina</a> · USECASE-STUDIO.xyz<sup>™</sup> · Beta Version</div>
  </div>
</div>

<script>
  const REDIRECT_TO = '/branchops';

  /* Dikeluarkan karena menganggur (?idle=1 dari branchops.html). Tanpa
     penjelasan ini, layar masuk yang muncul tiba-tiba di tengah pekerjaan
     terbaca sebagai aplikasi yang rusak, bukan sebagai batas waktu. */
  if (new URLSearchParams(location.search).has('idle')) {
    document.getElementById('idle-note').style.display = 'block';
  }

  const existing = localStorage.getItem('branchops_token');
  if (existing) {
    fetch('/api/branchops/me', { headers: { 'Authorization': 'Bearer ' + existing } })
      .then(r => { if (r.ok) location.href = REDIRECT_TO; })
      .catch(() => {});
  }

  async function doLogin() {
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    const email = document.getElementById('login-email').value.trim();
    const pw    = document.getElementById('login-pw').value;
    err.textContent = '';
    if (!email || !pw) { err.textContent = 'Please enter email and password.'; return; }

    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
    try {
      const res = await fetch('/api/branchops/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pw }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Login failed.');
      localStorage.setItem('branchops_token', data.token);
      location.href = REDIRECT_TO;
    } catch (e) {
      err.textContent = e.message || 'Login failed.';
      btn.innerHTML = 'Sign In';
      btn.disabled = false;
    }
  }

  document.getElementById('login-pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  document.getElementById('pw-toggle').addEventListener('click', () => {
    const inp = document.getElementById('login-pw');
    const btn = document.getElementById('pw-toggle');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
</script>
</body>
</html>
